name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked

  # The crates that do not need the Windows host build and test on Linux too,
  # so a change to them is checked on both and can be worked on without
  # Windows. victory-gpu builds here and runs its host-independent tests; it
  # is left out of clippy because code used only by the Windows host shows
  # as unused.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORTABLE: >-
        -p victory-core -p victory-pe -p victory-formats -p victory-shader
        -p victory-pipeline -p victory-game -p xtask
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy, portable crates
        run: cargo clippy $PORTABLE --all-targets --locked -- -D warnings
      - name: Tests, portable crates and victory-gpu
        run: cargo test $PORTABLE -p victory-gpu --locked
